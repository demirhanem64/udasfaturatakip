name: UDAŞ Fiyat Güncelleme Robotu

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # Her gece 03:00'te çalışır

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Kütüphaneleri Yükle
        run: |
          pip install requests beautifulsoup4
          
      - name: Fiyatları Tara ve Güncelle
        run: python scraper.py
        
      - name: Değişiklikleri Kaydet
        run: |
          git config --global user.name 'UDAŞ Robotu'
          git config --global user.email 'robot@udasfaturatakip.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "UDAŞ Fiyatları Otomatik Güncellendi"
          git push origin main || echo "Değişiklik yok"
