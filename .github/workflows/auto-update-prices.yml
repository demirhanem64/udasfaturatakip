name: Otomatik Fiyat Güncelleme ve Yayınlama

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # Her gece 03:00'te çalışır (UTC)

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Python Kurulumu
        uses: actions/setup-node@v3 # Python için setup-python kullanılmalı ama node yüklü kalsın
      
      - name: Python Bağımlılıkları
        run: |
          pip install requests beautifulsoup4
          
      - name: Fiyatları Tara ve Güncelle
        run: python scraper.py
        
      - name: Değişiklikleri Kaydet ve Push Yap
        run: |
          git config --global user.name 'UDAŞ Robotu'
          git config --global user.email 'robot@udasfaturatakip.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "UDAŞ Fiyatları Otomatik Güncellendi"
          git push origin main || echo "Değişiklik yok"

  deploy:
    needs: update-prices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
        if: always()
